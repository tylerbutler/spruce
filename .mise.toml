[tools]
# Local development uses OTP 28; CI sweeps 26/27/28.
erlang = "28"
# Pin gleam to match the CI/publish jobs (which pin 1.16.0)
# so the SBOM job resolves dependencies with the same toolchain as everything
# else. Bump in lockstep with the CI setup and workflow version pins.
gleam = "1.16.0"
just = "latest"
node = "22.22.3"
"github:tylerbutler/trellis" = "1.0.0"
# licence_audit: licence/vulnerability checks and CycloneDX SBOMs.
# Mise installs a self-contained GitHub release executable.
"github:tylerbutler/licence_audit" = "1.0.0-rc.3"

[env]
LC_ALL = "en_US.UTF-8"
