package = "spruce"
kind = "Major Release"
body = "symbol.Mode is removed. Use spruce.SymbolMode (spruce.Unicode / spruce.Ascii) instead. The Spruce context now carries a symbol_mode (default Unicode), and renderers — message, severity, item, output.title, tree, and Markdown alerts — consult it automatically. Bullets and icons no longer derive their ASCII fallback from color support: set the mode explicitly with spruce.with_symbol_mode(context, spruce.Ascii) and read it back with spruce.symbol_mode(context)."
