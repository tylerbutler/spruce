kind: Major Release
body: 'spruce.ColorLevel, spruce.Background, and spruce.Stream are now defined by spruce rather than re-exported from tty, so their constructors are available without importing tty: spruce.with_color_level(spruce.TrueColor), spruce.with_background(spruce.Dark), spruce.detect_stream(spruce.Stderr). Replace tty.TrueColor, tty.Light, tty.Stderr, and the other tty constructors with the spruce ones.'
time: 2026-08-24T13:25:56.862158886-07:00
