kind: Major Release
body: spruce.ColorLevel, spruce.Background, and spruce.Stream are spruce-owned enums instead of tty type aliases, so spruce.with_color_level(spruce.TrueColor), spruce.with_background(spruce.Dark), and spruce.detect_stream(spruce.Stderr) work without importing tty. Replace tty.TrueColor, tty.Light, tty.Stderr, etc. with the spruce constructors.
