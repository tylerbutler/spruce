kind: Major Release
body: 'spruce/block is merged into spruce/box. A box is now built with one chain: start from box.new() (rounded cyan border, one cell of horizontal padding) or box.plain() (no border, no padding), then apply title, foreground, background, padding, margin, width, height, align, border, border_color, border_colors, and border_sides before render. BoxOptions, box.options, and box.default_options are removed: write box.new() |> box.title(t) |> box.border_color(c) instead of box.options(title: t, color: c), and box.plain() instead of block.new().'
time: 2026-08-24T13:25:47.527122551-07:00
