kind: Major Release
body: 'spruce 2.0 consolidates overlapping modules: one box builder, one border glyph set, one status formatter, one place for indentation, and one module for composing output. Every module except spruce/tree, spruce/details, spruce/highlight, and spruce/markdown changes in some way; each entry in this release notes the replacement for what it removes.'
