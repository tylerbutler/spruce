kind: Major Release
body: 'spruce/message now provides only the seven one-liners success, fail, start, ready, info, warn, and error, each rendering an icon, label, and text. Its Options and Formatter types, default_options, with_details, with_symbol_mode, with_formatter, label, badge, simple, custom, line_with, the *_with variants, and the print_* variants are removed. For badges, key-value details, ASCII glyphs, or custom prefixes, build a spruce/line with line.severity and line.severity_formatter; print with io.println or collect lines with spruce/output.'
time: 2026-08-24T13:25:51.679267784-07:00
