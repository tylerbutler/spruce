kind: Major Release
body: spruce/message is reduced to the seven one-liners success, fail, start, ready, info, warn, and error. Kind, Options, Formatter, default_options, with_details, with_symbol_mode, with_formatter, label, badge, simple, custom, line_with, the *_with variants, and the print_* variants are removed. For badges, details, symbol modes, or custom prefixes compose a spruce/line with line.severity and line.severity_formatter (spruce/severity owns the one Formatter type); print with io.println or collect lines with spruce/output.
