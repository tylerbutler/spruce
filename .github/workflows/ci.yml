name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Target-independent checks: run once, not per version.
  checks:
    runs-on: ubuntu-24.04
    name: Checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Lint (formatting + glinter)
        run: just lint

      - name: Type check
        run: just check

      - name: Build documentation
        run: just docs

      - name: Setup audit tool from mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # ratchet:jdx/mise-action@v5
        with:
          install_args: github:tylerbutler/licence_audit
          add_shims_to_path: "false"
          export_path: "false"

      - name: Audit licences and vulnerabilities
        run: mise exec github:tylerbutler/licence_audit -- just audit

  website:
    runs-on: ubuntu-24.04
    name: Website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node: "true"
          node-version: "22.22.3"

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build workbench facade
        run: npm run build:gleam --prefix website

      - name: Check workbench facade
        run: npm run check:gleam --prefix website

      - name: Check terminal snapshots
        run: npm run check:terminal --prefix website

      - name: Test website
        run: npm test --prefix website

      - name: Build website
        run: npm run build --prefix website

  # Erlang target: sweep OTP across the supported range (claim: OTP >= 26).
  # Node is irrelevant to this target, so it is not installed here.
  test-erlang:
    runs-on: ubuntu-24.04
    name: Test Erlang (OTP ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        otp: ["26", "27", "28"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.16.0"

      - name: Build (warnings as errors)
        run: gleam build --target erlang --warnings-as-errors

      - name: Run tests
        run: gleam test --target erlang

  # JavaScript target: sweep Node across the supported range (claim: Node >= 20.19).
  # A fixed OTP only hosts the Gleam compiler; it does not affect JS output.
  test-javascript:
    runs-on: ubuntu-24.04
    name: Test JavaScript (Node ${{ matrix.node.major }})
    strategy:
      fail-fast: false
      matrix:
        node:
          - version: "20.19.6"
            major: "20"
          - version: "22.22.3"
            major: "22"
          - version: "24.16.0"
            major: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          otp-version: "27"
          gleam-version: "1.16.0"
          node: "true"
          node-version: ${{ matrix.node.version }}

      - name: Build (warnings as errors)
        run: gleam build --target javascript --warnings-as-errors

      - name: Run tests
        run: gleam test --target javascript
