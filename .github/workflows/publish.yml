name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish-hex:
    name: Publish Hex
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Gleam
        uses: tylerbutler/actions/setup-gleam@d7e1e50c375c5eb1a912a0849052ce8473881ecc # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          erlang-version: "27.2"
          gleam-version: "1.16.0"
          run-deps: "false"

      - name: Download dependencies
        run: gleam deps download

      - name: Install Trellis
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/tylerbutler/trellis/releases/download/v0.11.2/trellis-gleam-installer.sh | sh

      - name: Publish package to Hex
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: trellis publish --tag "$GITHUB_REF_NAME"

  sbom:
    name: Attest and Upload Artifacts
    # Runs after the package is on Hex so assets are only attached for versions
    # that actually published. Trellis creates the Release with the tag, so this job only
    # uploads assets to the existing Release — no race, no create.
    needs: [validate, publish-hex]
    if: ${{ needs.publish-hex.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # ratchet:jdx/mise-action@v5
        env:
          # Avoid unauthenticated GitHub API rate limits when mise resolves the
          # licence_audit release and verifies its build attestations.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependencies
        run: gleam deps download

      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Strip the leading "v" from the tag so asset names use bare semver
          # (e.g. spruce-1.0.0.cdx.json), matching the Hex package version.
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          licence_audit sbom --output="dist/spruce-${VERSION}.cdx.json"

      - name: Create source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="spruce-${VERSION}/" \
            -o "dist/spruce-${VERSION}.tar.gz" HEAD

      - name: Generate checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # SHA-256 checksums for the published artifacts. Run from dist/ so the
          # file records bare names (not dist/ prefixes); the checksums file does
          # not include itself.
          cd dist
          sha256sum \
            "spruce-${VERSION}.tar.gz" \
            "spruce-${VERSION}.cdx.json" \
            > "spruce-${VERSION}.sha256sum"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # ratchet:actions/attest@v4
        with:
          subject-path: dist/spruce-${{ steps.version.outputs.version }}.tar.gz
          sbom-path: dist/spruce-${{ steps.version.outputs.version }}.cdx.json

      - name: Attest build provenance
        # SLSA build provenance for every shipped artifact, including the
        # checksums file — verifying the checksums file's provenance lets
        # consumers verify the rest offline against it.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/spruce-${{ steps.version.outputs.version }}.tar.gz
            dist/spruce-${{ steps.version.outputs.version }}.cdx.json
            dist/spruce-${{ steps.version.outputs.version }}.sha256sum

      - name: Upload SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Trellis already created the Release together with the tag, so it
          # exists before this tag-triggered run.
          # We only attach assets here. The Release is keyed by the tag
          # ($REF_NAME, e.g. v1.0.0); asset files use bare semver ($VERSION).
          gh release upload "$REF_NAME" \
            "dist/spruce-${VERSION}.cdx.json" \
            "dist/spruce-${VERSION}.tar.gz" \
            "dist/spruce-${VERSION}.sha256sum" \
            --clobber
